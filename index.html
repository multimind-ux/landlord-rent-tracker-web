<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <meta
      name="description"
      content="RentTracker — a clean dashboard for managing tenants, rent records, payments and reminders."
    />
    <title>RentTracker · Landlord Dashboard</title>
    <script>
      // Apply the saved theme before paint to avoid a light flash.
      try {
        var saved = localStorage.getItem("rent_tracker_theme");
        var dark = saved
          ? saved === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      } catch (error) {
        // Ignore storage access errors.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
